[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-api"
version = "0.1.0"
description = "API for the course-aware study system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "python-multipart>=0.0.18",
  "pgvector>=0.3.6",
  "email-validator>=2.2",
  "pypdf>=5.1",
  "openai>=1.60",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
