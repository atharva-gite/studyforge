services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    ports:
      - "5432:5432"
    volumes:
      - folio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  folio_pg:
